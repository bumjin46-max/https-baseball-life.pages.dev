<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야구 인생 — 한 선수의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1a15;      /* 야간 경기장 잔디 그림자 */
  --turf:#14261f;
  --turf2:#1b332a;
  --dirt:#6b4630;       /* 내야 흙 */
  --clay:#c07a45;       /* 포인트 */
  --chalk:#eceadf;      /* 라인 */
  --chalk-dim:#9aa79f;
  --lamp:#f5c451;       /* 전광판 */
  --red:#d2604f;
  --blue:#6f9fc4;
  --line:rgba(236,234,223,.14);
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 50% -10%, #1d3a2e 0%, transparent 60%),
    var(--night);
  color:var(--chalk);
  font-family:"IBM Plex Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.6;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:"Gowun Batang",serif;font-weight:700;letter-spacing:-.01em}
.num{font-family:"Bebas Neue",sans-serif;letter-spacing:.04em;color:var(--lamp);font-weight:400}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

/* ── 레이아웃 ── */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.stage{display:grid;grid-template-columns:230px minmax(0,1fr) 220px;gap:16px;align-items:start}
@media(max-width:940px){.stage{grid-template-columns:1fr}.side{order:2}.main{order:1}}

/* ── 전광판 헤더 ── */
.board{
  border:1px solid var(--line);background:linear-gradient(180deg,#132420,#0f1c18);
  padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.board .who{font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;margin-right:4px}
.board .bit{font-size:12.5px;color:var(--chalk-dim)}
.board .bit b{font-family:"Bebas Neue",sans-serif;font-size:17px;color:var(--lamp);font-weight:400;margin-left:5px;vertical-align:-1px}
.cond{margin-left:auto;font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:999px}

/* ── 패널 ── */
.panel{border:1px solid var(--line);background:rgba(20,38,31,.55);padding:14px}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--chalk-dim);font-weight:400;letter-spacing:.06em}

/* 능력치 바 */
.stat{margin-bottom:9px}
.stat .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.stat .row span:last-child{font-family:"Bebas Neue",sans-serif;font-size:16px;color:var(--chalk)}
.bar{height:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--clay),var(--lamp));display:block}
.bar i.hi{background:linear-gradient(90deg,#8fd6a6,#dff5a0)}
.up{color:#8fd6a6}.down{color:var(--red)}

/* 특성 카드 */
.traits{display:grid;gap:8px}
.tcard{border:1px solid var(--line);padding:8px 10px;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);position:relative}
.tcard .tn{font-family:"Gowun Batang",serif;font-weight:700;font-size:14.5px}
.tcard .td{font-size:11.5px;color:var(--chalk-dim);line-height:1.45}
.tcard .gr{position:absolute;top:8px;right:9px;font-size:10px;letter-spacing:.08em}
.g일반{color:#9aa79f}.g희귀{color:#6f9fc4}.g영웅{color:#b58ad6}.g전설{color:var(--lamp)}.g신화{color:var(--red)}
.tcard.empty{border-style:dashed;opacity:.35;text-align:center;font-size:12px;padding:12px 10px}
.tcard.neg{border-color:rgba(210,96,79,.4)}

/* ── 중앙 이벤트 ── */
.scene{border:1px solid var(--line);background:linear-gradient(180deg,rgba(27,51,42,.7),rgba(15,28,24,.7));padding:26px 26px 22px;min-height:380px;display:flex;flex-direction:column}
.scene .when{font-size:12px;color:var(--clay);margin-bottom:10px}
.scene h2{margin:0 0 14px;font-size:26px;line-height:1.3}
.scene .body{font-size:15.5px;line-height:1.85;white-space:pre-wrap;flex:1}
.scene .body em{color:var(--lamp);font-style:normal}
.choices{display:grid;gap:9px;margin-top:22px}
.choice{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:12px 14px;transition:background .12s,border-color .12s}
.choice:hover{background:rgba(245,196,81,.09);border-color:rgba(245,196,81,.45)}
.choice .ct{font-size:15px}
.choice .cs{font-size:12px;color:var(--chalk-dim);margin-top:2px}
.go{background:var(--clay);border:none;color:#1a0f07;font-weight:600;padding:12px 26px;margin-top:20px;align-self:flex-start}
.go:hover{background:var(--lamp)}
.ghost{background:transparent;border:1px solid var(--line);padding:10px 18px}
.ghost:hover{border-color:var(--lamp)}

/* 로그 */
.log{margin-top:14px;font-size:13.5px;border-left:2px solid var(--clay);padding:4px 0 4px 14px;display:grid;gap:7px;color:#cfd6d0}
.log .k{color:var(--lamp)}

/* 표 */
table.rec{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.rec th{text-align:right;font-weight:500;color:var(--chalk-dim);font-size:11.5px;padding:5px 6px;border-bottom:1px solid var(--line)}
table.rec th:first-child{text-align:left}
table.rec td{text-align:right;padding:5px 6px;border-bottom:1px solid rgba(236,234,223,.06);font-family:"Bebas Neue",sans-serif;font-size:16px}
table.rec td:first-child{text-align:left;font-family:"IBM Plex Sans KR";font-size:13px}
.tabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-bottom:none;padding:7px 14px;font-size:13px;color:var(--chalk-dim)}
.tab.on{color:var(--lamp);border-color:var(--lamp);background:rgba(245,196,81,.08)}

/* 타이틀 화면 */
.title{max-width:620px;margin:6vh auto;text-align:center}
.title .kicker{font-size:12.5px;color:var(--clay);margin-bottom:14px}
.title h1{font-size:clamp(38px,9vw,64px);margin:0;line-height:1.05}
.title .sub{color:var(--chalk-dim);margin:16px auto 34px;max-width:420px;font-size:14.5px}
.menu{display:grid;gap:10px;max-width:320px;margin:0 auto}
.menu button{padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.menu button:hover{border-color:var(--lamp);color:var(--lamp)}
.menu button[disabled]{opacity:.3;cursor:not-allowed}

/* 엔딩 */
.ending{max-width:640px;margin:0 auto;text-align:center;border:1px solid var(--line);padding:34px 26px;background:linear-gradient(180deg,rgba(27,51,42,.7),rgba(13,26,21,.9))}
.ending .nm{font-family:"Gowun Batang",serif;font-size:40px;margin:6px 0}
.ending .yr{color:var(--chalk-dim);font-size:14px;letter-spacing:.1em}
.rule{height:1px;background:var(--line);margin:22px 0}
.bigline{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:18px 0}
.bigline div{text-align:center}
.bigline .n{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--lamp);line-height:1}
.bigline .l{font-size:11.5px;color:var(--chalk-dim)}
.verdict{font-family:"Gowun Batang",serif;font-size:27px;color:var(--lamp);margin:8px 0 12px}
.quote{font-family:"Gowun Batang",serif;font-size:16px;line-height:1.9;color:#dfe4dd}
.tl{text-align:left;display:grid;gap:6px;font-size:13.5px;max-width:360px;margin:0 auto}
.tl div{display:flex;gap:14px}
.tl b{font-family:"Bebas Neue",sans-serif;color:var(--clay);font-weight:400;font-size:16px;min-width:38px}

/* 기타 */
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--line);padding:1px 8px;border-radius:999px;color:var(--chalk-dim);margin:0 4px 4px 0}
.center{text-align:center}
.dim{color:var(--chalk-dim)}
.sm{font-size:12.5px}
.grade{font-family:"Bebas Neue",sans-serif;font-size:40px;color:var(--lamp);line-height:1}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#1b332a;border:1px solid var(--lamp);padding:10px 18px;z-index:50;font-size:13.5px}
.hofrow{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 0}
.hofrow .rk{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--clay);min-width:30px}
.hofrow .nm{font-family:"Gowun Batang",serif;font-size:16px;min-width:74px}
@media (prefers-reduced-motion:no-preference){
  .scene{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ==========================================================================
   [1] UTIL — 난수, 저장소
   ========================================================================== */
const R = {
  f:(a,b)=>a+Math.random()*(b-a),
  i:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  c:p=>Math.random()<p,
  pick:a=>a[Math.floor(Math.random()*a.length)],
  norm:(m,s)=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
    return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
  shuffle:a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round=(v,d)=>Math.round(v*10**d)/10**d;
const avg3=v=>v.toFixed(3).replace(/^0/,'');

const MEM={};
const Store={
  async get(k){ try{const r=await window.storage.get(k);return r?JSON.parse(r.value):(MEM[k]??null);}catch(e){return MEM[k]??null;} },
  async set(k,v){ MEM[k]=v; try{await window.storage.set(k,JSON.stringify(v));}catch(e){} },
  async del(k){ delete MEM[k]; try{await window.storage.delete(k);}catch(e){} }
};

/* ==========================================================================
   [2] DATA — 구단
   ========================================================================== */
const TEAMS=[
  {id:'seoul', name:'서울 블루스',   short:'서울', money:5, dev:3, pdev:3, fan:5, star:5, power:4, tag:'자금력과 팬덤이 리그 최고. 대신 자리 경쟁이 치열하다.'},
  {id:'busan', name:'부산 웨일스',   short:'부산', money:3, dev:3, pdev:2, fan:5, star:3, power:3, tag:'열성 팬덤. 성적이 나쁘면 여론도 험하다.'},
  {id:'incheon',name:'인천 마리너스', short:'인천', money:4, dev:2, pdev:4, fan:3, star:4, power:4, tag:'투수 육성의 명가.'},
  {id:'daejeon',name:'대전 파이오니어스',short:'대전',money:2,dev:5,pdev:3,fan:3,star:2,power:2, tag:'유망주에게 기회를 아끼지 않는다.'},
  {id:'gwangju',name:'광주 타이탄스', short:'광주', money:4, dev:4, pdev:3, fan:4, star:4, power:4, tag:'전통의 강호. 우승 경험이 많다.'},
  {id:'daegu', name:'대구 레이더스', short:'대구', money:4, dev:3, pdev:3, fan:4, star:5, power:4, tag:'스타 영입에 적극적이다.'},
  {id:'suwon', name:'수원 스톰',     short:'수원', money:3, dev:4, pdev:4, fan:3, star:3, power:3, tag:'데이터 야구를 앞세운 신흥 구단.'},
  {id:'changwon',name:'창원 샤크스', short:'창원', money:2, dev:4, pdev:2, fan:3, star:2, power:2, tag:'가난하지만 끈끈하다.'},
  {id:'goyang',name:'고양 크라운',   short:'고양', money:3, dev:5, pdev:3, fan:2, star:2, power:3, tag:'키워서 파는 구단. 육성은 최고다.'},
  {id:'seongnam',name:'성남 레이븐스',short:'성남',money:2,dev:2,pdev:2,fan:2,star:2,power:2, tag:'만년 하위권. 하지만 기회는 많다.'}
];
const TEAM=id=>TEAMS.find(t=>t.id===id);

const SURNAME=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','전','홍','고','문','손','배','백','허','유','남','심'];
const GIVEN=['도윤','태준','재현','성호','준혁','민석','현우','우진','준호','지호','시우','건우','승현','예준','주원','지훈','현서','동하','태양','상우','기윤','우성','해성','진우','세진','찬영','민찬','영호','도훈','윤재'];
const mkName=()=>R.pick(SURNAME)+R.pick(GIVEN.filter(g=>/^[가-힣]{2}$/.test(g)));

/* ==========================================================================
   [3] DATA — 능력치 정의
   ========================================================================== */
const POS={
  batter:{
    label:'타자',
    desc:'매 경기 타석에 선다. 기록이 눈에 보이고, 팬도 가장 빨리 알아본다.',
    keys:['contact','power','eye','speed','run','defense','throw','mental','stamina'],
    base:{contact:52,power:46,eye:44,speed:50,run:46,defense:46,throw:46,mental:46,stamina:50}
  },
  pitcher:{
    label:'투수',
    desc:'닷새에 한 번 마운드에 오른다. 한 경기가 시즌 전체를 바꾼다.',
    keys:['velo','stuff','control','breaking','stamina','mental','crisis','recovery'],
    base:{velo:54,stuff:48,control:44,breaking:44,stamina:48,mental:46,crisis:42,recovery:48}
  },
  catcher:{
    label:'포수',
    desc:'기록에 남지 않는 일을 가장 많이 한다. 대신 팀이 가장 먼저 알아본다.',
    keys:['contact','power','eye','defense','throw','catching','blocking','lead','mental','stamina'],
    base:{contact:46,power:42,eye:44,defense:50,throw:50,catching:48,blocking:46,lead:44,mental:50,stamina:50}
  }
};
const SLABEL={contact:'컨택',power:'파워',eye:'선구안',speed:'주력',run:'주루',defense:'수비',throw:'송구',
  mental:'멘탈',stamina:'체력',velo:'구속',stuff:'구위',control:'제구',breaking:'변화구',crisis:'위기관리',
  recovery:'회복력',catching:'포구',blocking:'블로킹',lead:'리드'};

/* ==========================================================================
   [4] DATA — 특성
   eff 키: train(훈련효과) staminaCost injury clutch(중요상황) big(포스트시즌)
           contact power eye speed defense throw era k9 ip ctrl fan lead
   prob(p,s): 시즌 종료 시 획득 확률(0~1). s = 해당 시즌 기록
   ========================================================================== */
const T=(id,grade,pos,desc,eff,extra={})=>({id,grade,pos,desc,eff,...extra});
const TRAITS=[
/* ── 공통 ── */
T('노력파','일반','all','훈련 효과 +8%',{train:.08},{prob:(p)=>p.tend.diligence>=68?.45:0, evolve:{to:'연습벌레',cond:p=>p.tend.diligence>=82&&p.trainCount>=16}}),
T('연습벌레','희귀','all','훈련 효과 +16%, 체력 소모 증가',{train:.16,staminaCost:.2}),
T('천재','영웅','all','잠재력 활용 효율 +25%, 일반 훈련 효과는 낮다',{potential:.25,train:-.05},{prob:p=>p.pot>=88&&p.age<=22?.3:0, evolve:{to:'야구천재',cond:p=>p.pot>=92&&ovr(p)>=85}}),
T('야구천재','전설','all','성장 한계를 스스로 밀어낸다',{potential:.4,train:.05}),
T('강심장','희귀','all','중요 경기 능력 +6',{clutch:6,big:.06},{prob:(p,s)=>s.bigHits>=3?.45:0, evolve:{to:'승부사',cond:p=>p.tend.competitive>=80}}),
T('승부사','영웅','all','중요 상황 능력 +10',{clutch:10,big:.1},{evolve:{to:'큰경기의 사나이',cond:p=>p.awards.ksMvp>=1||p.post.bigHits>=8}}),
T('큰경기의 사나이','전설','all','포스트시즌에서 전혀 다른 선수가 된다',{clutch:14,big:.2}),
T('새가슴','일반','all','중요 상황 능력 -8',{clutch:-8,big:-.12},{neg:1,prob:(p,s)=>p.post.fail-p.post.bigHits>=2?.3:0}),
T('멘탈갑','희귀','all','부진에도 흔들리지 않는다. 컨디션 하락 완화',{condFloor:1},{prob:p=>p.st.mental>=82?.35:0}),
T('유리멘탈','일반','all','부진이 길어진다',{condCeil:-1},{neg:1,prob:p=>p.st.mental<=42?.3:0}),
T('철인','희귀','all','체력 소모 -20%, 부상 확률 -35%',{staminaCost:-.2,injury:-.35},{prob:(p,s)=>s.g>=138&&p.injuries.length===0?.5:0, evolve:{to:'강철몸',cond:p=>p.career.seasons.filter(x=>x.games>=135).length>=5}}),
T('강철몸','전설','all','그는 좀처럼 그라운드를 비우지 않는다',{staminaCost:-.3,injury:-.6}),
T('유리몸','희귀','all','부상 확률 +55%',{injury:.55},{neg:1,evolve:{to:'재활왕',cond:p=>p.injuries.length>=3&&p.tend.patience>=75}}),
T('재활왕','영웅','all','부상에서 남들보다 빨리 돌아온다',{injury:.15,rehab:.5}),
T('자기관리','희귀','all','노쇠화 속도 -30%',{aging:-.3},{prob:p=>p.tend.diligence>=80&&p.age>=28?.28:0}),
T('게으름','일반','all','훈련 효과 -15%, 휴식 효과 +40%',{train:-.15,rest:.4},{neg:1,prob:p=>p.tend.diligence<=35?.35:0}),
T('팀플레이어','일반','all','팀 관계 상승, 리더십 성장',{teamB:1},{prob:p=>p.tend.loyalty>=70&&p.tend.selfish<=40?.4:0, evolve:{to:'주장감',cond:p=>p.tend.leadership>=78&&p.age>=27}}),
T('독고다이','희귀','all','개인 기록에 강하지만 팀 관계가 어렵다',{teamB:-2,clutch:3},{neg:1,prob:p=>p.tend.selfish>=72?.4:0}),

/* ==========================================================================

const COND_NAME=['최악','나쁨','보통','좋음','최고조'];
const COND_MOD=[-.10,-.05,0,.02,.05];

function createPlayer(name,pos){
  const base=POS[pos].base, st={};
  POS[pos].keys.forEach(k=>st[k]=clamp(Math.round(R.norm(base[k]+2,8)),28,74));
  const o0=ovrOf(pos,st);
  const pot=clamp(Math.round(o0+R.norm(30,11)),o0+10,99);
  const team=R.pick(TEAMS);
  const rnd=pot+o0>=145?1:(pot+o0>=128?2:(pot+o0>=112?3:R.i(4,6)));
  const p={
    name,pos,age:R.i(18,20),year:2026,team:team.id,teamsPlayed:[team.id],draftRound:rnd,
    st,pot,cond:2,fatigue:10,
    traits:[],traitLog:[],
    tend:{diligence:R.i(40,60),competitive:R.i(40,60),leadership:R.i(30,55),selfish:R.i(30,55),
          loyalty:R.i(45,65),star:R.i(30,55),patience:R.i(40,60),aggression:R.i(40,60),social:R.i(40,60)},
    rel:{manager:50,vet:45,team:50},
    flags:[],vet:mkName(),
    rival:mkRival(pos),
    season:null,career:{seasons:[]},
    tot:{g:0,pa:0,h:0,hr:0,rbi:0,sb:0,bb:0,so:0,ab:0,war:0,ip:0,w:0,l:0,sv:0,k:0,er:0},
    awards:{mvp:0,allstar:0,gg:0,hrKing:0,hitKing:0,sbKing:0,winKing:0,soKing:0,eraKing:0,rookie:0,champ:0,ksMvp:0},
    post:{games:0,war:0,bigHits:0,fail:0},
    nat:{caps:0,gold:0,bigMoment:0},
    injuries:[],timeline:[],fanRating:50,fame:0,
    lv:'2군',seasonsPlayed:0,peakAge:20,bestWar:0,trainCount:0,
    gamesTotal:0,seenEvents:[],clutchBonus:0,teamBoost:0,retired:false
  };
  p.timeline.push({y:2026,t:`${TEAM(team.id).name} ${rnd}라운드 지명`});
  return p;
}
function mkRival(myPos){
  const pos=R.c(.5)?myPos:R.pick(['batter','pitcher','catcher']);
  return {name:mkName(),pos,ovr:R.i(50,62),pot:R.i(76,95),war:0,totWar:0,bond:50,
          team:R.pick(TEAMS).id,mvp:0,peak:0};
}

/* ── 능력 종합 ── */
const W_OVR={
  batter:{contact:.25,power:.19,eye:.11,speed:.06,run:.07,defense:.12,throw:.05,mental:.08,stamina:.07},
  pitcher:{velo:.15,stuff:.25,control:.22,breaking:.14,stamina:.10,mental:.05,crisis:.06,recovery:.03},
  catcher:{contact:.17,power:.10,eye:.08,defense:.14,throw:.11,catching:.09,blocking:.08,lead:.13,mental:.06,stamina:.04}
};
function ovrOf(pos,st){let s=0;for(const k in W_OVR[pos])s+=st[k]*W_OVR[pos][k];return Math.round(s);}
function ovr(p){return ovrOf(p.pos,p.st);}

/* ── 특성 효과 합산 ── */
function tEff(p,key){
  let v=0;
  p.traits.forEach(id=>{const t=TR(id);if(t&&t.eff[key]!==undefined)v+=t.eff[key];});
  return v;
}
function ab(p,key){ // 경기용 실효 능력치
  return (p.st[key]||0)+tEff(p,key==='control'?'ctrl':key);
}

/* ── 성향/관계/플래그/성장 ── */
function tend(p,o){for(const k in o)p.tend[k]=clamp((p.tend[k]||50)+o[k],0,100);}
function rel(p,k,v){p.rel[k]=clamp((p.rel[k]||50)+v,0,100);}
function flag(p,f){if(!p.flags.includes(f))p.flags.push(f);}
function grow(p,o){
  for(const k in o){ if(p.st[k]===undefined)continue;
    p.st[k]=clamp(round(p.st[k]+o[k],1),1,100);}
}
function ageCurve(p){
  const a=p.age, late=tEff(p,'lateGrow');
  if(a<=22)return 1.35; if(a<=27)return 1.05; if(a<=30)return .72;
  if(a<=33)return .34+late*.4; return .12+late*.35;
}
function potRoom(p,k){
  const gap=p.pot-p.st[k];
  return clamp(gap/26,-0.2,1.25)*(1+tEff(p,'potential'));
}

/* ── 훈련 ── */
function doTraining(p,t){
  const log=[];
  p.trainCount++;
  const teamDev=(p.pos==='pitcher'?TEAM(p.team).pdev:TEAM(p.team).dev)/10;
  const mult=(1+tEff(p,'train')+teamDev)*ageCurve(p)*(p.cond>=3?1.08:p.cond<=1?.85:1);
  if(t.rest){
    const r=1+tEff(p,'rest');
    p.fatigue=clamp(p.fatigue+t.fatigue*r,0,100);
    p.cond=clamp(p.cond+1,0,4);
    log.push('충분히 쉬었다. 몸이 가벼워졌다.');
  }else{
    const changes=[];
    for(const k in t.up){
      if(p.st[k]===undefined)continue;
      let g=t.up[k]*mult;
      if(g>0)g*=clamp(potRoom(p,k),0.08,1.25);
      g=round(g*R.f(.75,1.3),1);
      if(Math.abs(g)<0.1)continue;
      p.st[k]=clamp(round(p.st[k]+g,1),1,100);
      changes.push(`${SLABEL[k]} ${g>0?'+':''}${round(g,1)}`);
    }
    p.fatigue=clamp(p.fatigue+t.fatigue*(1+tEff(p,'staminaCost')),0,100);
    if(t.tend)tend(p,t.tend);
    tend(p,{diligence:1});
    if(t.risk)p.injRisk=(p.injRisk||0)+t.risk*.1;
    log.push(changes.length?changes.join('   '):'큰 변화는 없었다.');
    if(mult<0.5)log.push('예전만큼 몸이 따라오지 않는다.');
  }
  updateCond(p);
  return log;
}
function updateCond(p){
  let c=2;
  if(p.fatigue<20)c=4; else if(p.fatigue<38)c=3; else if(p.fatigue<60)c=2;
  else if(p.fatigue<80)c=1; else c=0;
  c+=Math.round((p.st.mental-50)/40);
  c=clamp(c+ (tEff(p,'condFloor')?0:0),0,4);
  if(tEff(p,'condFloor'))c=Math.max(c,1);
  if(tEff(p,'condCeil'))c=Math.min(c,3);
  p.cond=clamp(c,0,4);
}

/* ==========================================================================
   [10] ENGINE — 출전 등급 / 시즌 시뮬레이션
   ========================================================================== */
function decideLevel(p){
  const o=ovr(p);
  if(p.pos==='pitcher'){
    if(o>=62)return '선발';
    if(o>=52)return '불펜';
    return p.age<=23?'2군':'불펜';
  }
  if(o>=62)return '주전';
  if(o>=52)return '백업';
  return p.age<=23?'2군':'백업';
}
function newSeason(p){
  p.lv=decideLevel(p);
  p.inPost=false;p.missGames=0;p.injRisk=0;p.clutchBonus=0;p.slump=p.slump||0;
  const teamStr=TEAM(p.team).power+R.f(-1.2,1.2)+(p.teamBoost||0)*.25+tEff(p,'teamB')*.2;
  p.season={year:p.year,age:p.age,team:p.team,lv:p.lv,
    g:0,pa:0,ab:0,h:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,d2:0,avg:0,ops:0,
    ip:0,w:0,l:0,sv:0,era:0,k:0,er:0,bb9:0,
    war:0,bigHits:0,events:[],traits:[],teamStr};
}
function condMod(p){return COND_MOD[p.cond];}

function simHalf(p,half,bonus){
  const s=p.season,log=[];
  const full = p.lv==='주전'||p.lv==='선발' ? 1 : (p.lv==='백업'||p.lv==='불펜' ? .62 : .24);
  const cm=1+condMod(p), clutch=(tEff(p,'clutch')+p.clutchBonus+bonus)*.4;
  const opp=R.f(-2,2);
  if(p.pos==='pitcher'){
    const starts=Math.round((p.lv==='선발'?15:p.lv==='불펜'?26:6)*full/ (p.lv==='선발'?1:1));
    const perOut=p.lv==='선발'?(4.3+ab(p,'stamina')*.028):(p.lv==='불펜'?1.5:3.4);
    let ip=round(starts*perOut*(1+tEff(p,'ip'))*cm,1);
    ip=round(ip*(1-(p.missGames||0)/144),1);
    const rate=ab(p,'stuff')*.34+ab(p,'control')*.30+ab(p,'velo')*.16+ab(p,'breaking')*.20;
    let era=8.4-rate*.072-tEff(p,'era')-clutch*.02+R.norm(0,.55)+opp*.06-(ab(p,'crisis')-50)*.006;
    era=clamp(round(era*(1-condMod(p)*.6),2),1.15,9.5);
    const k9=clamp((2.5+(ab(p,'velo')-45)*.085+(ab(p,'stuff')-45)*.06+ab(p,'breaking')*.018)*(1+tEff(p,'k9')),3,15);
    const bb9=clamp((7.5-ab(p,'control')*.062)*(1+tEff(p,'bb')),1.1,7);
    const dec=Math.round(starts*(p.lv==='선발'?.68:.26));
    const wr=clamp(.44+(4.70-era)*.075+(s.teamStr-3)*.035+tEff(p,'win')*.4,.18,.80);
    const w=Math.round(dec*wr), l=Math.max(0,dec-w);
    const sv=p.lv==='불펜'?Math.round(starts*R.f(.1,.45)):0;
    s.ip=round(s.ip+ip,1); s.w+=w; s.l+=l; s.sv+=sv;
    s.k+=Math.round(ip/9*k9); s.er+=Math.round(ip/9*era); s.g+=starts;
    s.bb9=round(bb9,1);
    log.push(`${half} ${starts}경기 ${ip}이닝  ${w}승 ${l}패  평균자책 ${round(era,2)}  탈삼진 ${Math.round(ip/9*k9)}`);
  }else{
    const catcherF=p.pos==='catcher'?.86:1;
    let gm=Math.round((p.lv==='주전'?72:p.lv==='백업'?44:16)*catcherF);
    gm=Math.max(2,gm-Math.round((p.missGames||0)/2));
    const pa=Math.round(gm*(p.lv==='주전'?4.3:3.6));
    const C=ab(p,'contact')-(p.slump?5:0),P=ab(p,'power'),E=ab(p,'eye');
    let avg=.140+C*.0019+E*.0002+condMod(p)*.12+clutch*.0012+R.norm(0,.021)-opp*.002;
    avg=clamp(avg,.130,.400);
    const bbR=clamp((E/100)*.135*(1+tEff(p,'bb')),.02,.22);
    const soR=clamp(.245-C*.0012+P*.0008+tEff(p,'so'),.06,.36);
    const bb=Math.round(pa*bbR), so=Math.round(pa*soR);
    const abn=Math.max(1,pa-bb-Math.round(pa*.02));
    const h=Math.round(abn*avg);
    const hr=Math.round(pa*Math.pow(P/100,3.2)*.062*cm);
    const d2=Math.round(h*(.15+P*.0009));
    const att=Math.round(Math.pow(ab(p,'run')/100,2)*gm*.6);
    const sb=Math.round(att*(.58+ab(p,'speed')*.003));
    const rbi=Math.round(hr*2.15+h*.33+(s.teamStr-3)*4+clutch*.5);
    const r=Math.round(h*.42+bb*.24+hr*.4);
    s.g+=gm;s.pa+=pa;s.ab+=abn;s.h+=Math.min(h,abn);s.hr+=hr;s.d2+=d2;
    s.bb+=bb;s.so+=so;s.sb+=Math.max(0,sb);s.rbi+=rbi;s.r+=r;
    log.push(`${half} ${gm}경기  타율 ${avg3(avg)}  ${h}안타 ${hr}홈런 ${rbi}타점 ${sb}도루`);
  }
  // 피로/경험
  p.fatigue=clamp(p.fatigue+ (28*full)*(1+tEff(p,'staminaCost')) - ab(p,'stamina')*.09,0,100);
  p.gamesTotal+=s.g;
  expGrowth(p,full);
  updateCond(p);
  const inj=rollInjury(p,full);
  if(inj)log.push(inj);
  if(p.slump)p.slump=0;
  return log;
}
function expGrowth(p,full){ // 경기 경험에 의한 자연 성장
  const m=ageCurve(p)*full*.72;
  const keys=POS[p.pos].keys;
  keys.forEach(k=>{
    const g=round(R.f(0,.9)*m*clamp(potRoom(p,k),0,1.2),1);
    if(g>0.05)p.st[k]=clamp(round(p.st[k]+g,1),1,100);
  });
}
function rollInjury(p,full){
  let c=.055*full*(1+(p.fatigue-40)/110)*(1+tEff(p,'injury'))*(1+(p.injRisk||0));
  c*= p.age>=33?1.5:p.age>=30?1.2:1;
  c*= 1-clamp((p.st.stamina-50)/220,-.2,.25);
  if(!R.c(clamp(c,.01,.6)))return null;
  const sev=R.f(0,1);
  const days=sev>.85?R.i(90,160):sev>.55?R.i(35,70):R.i(10,28);
  const rehab=1-tEff(p,'rehab')*.4;
  const miss=Math.round(days*rehab/1.6);
  p.missGames=(p.missGames||0)+miss;
  p.injuries.push({y:p.year,days});
  p.fatigue=clamp(p.fatigue-15,0,100);
  if(days>=90){
    const k=p.pos==='pitcher'?'velo':'speed';
    p.st[k]=clamp(round(p.st[k]-R.f(1.5,4),1),1,100);
    p.timeline.push({y:p.year,t:'큰 부상 (시즌 아웃)'});
    flag(p,'injuryHistory');
    return `<em>부상</em> — ${days}일 진단. 시즌의 상당 부분을 잃었다.`;
  }
  return `<em>부상</em> — ${days}일 진단. ${miss}경기 결장.`;
}

/* ── 시즌 마감 계산 ── */
function finalizeSeason(p){
  const s=p.season;
  if(p.pos==='pitcher'){
    s.era=s.ip>0?round(s.er*9/s.ip,2):0;
    s.war=round(clamp((s.ip/9)*((4.90-s.era)*.17)+(s.sv*.06),-2,10),1);
  }else{
    s.avg=s.ab>0?s.h/s.ab:0;
    const obp=s.pa>0?(s.h+s.bb)/s.pa:0;
    const tb=s.h+s.d2+2*s.hr;
    const slg=s.ab>0?tb/s.ab:0;
    s.ops=round(obp+slg,3);
    let def=((ab(p,'defense')-58)/100)*1.6*(s.g/144);
    if(p.pos==='catcher')def+=1.2*(s.g/144)+((ab(p,'lead')-55)/100)*1.4;
    s.war=round(clamp((s.g/144)*((s.ops-.660)*15)+def+(s.sb*.012),-2,11),1);
  }
  // 통산 누적
  const t=p.tot;
  t.g+=s.g;t.pa+=s.pa;t.ab+=s.ab;t.h+=s.h;t.hr+=s.hr;t.rbi+=s.rbi;t.sb+=s.sb;
  t.bb+=s.bb;t.so+=s.so;t.ip=round(t.ip+s.ip,1);t.w+=s.w;t.l+=s.l;t.sv+=s.sv;
  t.k+=s.k;t.er+=s.er;t.war=round(t.war+s.war,1);
  if(s.war>p.bestWar){p.bestWar=s.war;p.peakAge=p.age;}
  p.seasonsPlayed++;
  // 라이벌 성장
  simRival(p);
  return s;
}
function simRival(p){
  const rv=p.rival;
  const curve=rv.ovrAge=p.age;
  const g=p.age<=22?R.f(2,6):p.age<=27?R.f(1,4):p.age<=31?R.f(-.5,1.5):R.f(-4,-.5);
  rv.ovr=clamp(round(rv.ovr+g*(rv.pot>rv.ovr?1:.3),1),30,99);
  rv.war=round(clamp((rv.ovr-58)*.33+R.norm(0,1.1),-1,11),1);
  rv.totWar=round(rv.totWar+Math.max(0,rv.war),1);
  if(rv.war>rv.peak)rv.peak=rv.war;
}

/* ── 리그 시상 ── */
function awardsPhase(p){
  const s=p.season,log=[],got=[];
  const lead={hr:R.norm(39,5),avg:R.norm(.347,.012),sb:R.norm(43,7),rbi:R.norm(118,10),
    w:R.norm(16,1.8),so:R.norm(186,18),era:R.norm(2.45,.3),war:Math.max(R.norm(7.3,1.1),p.rival.war)};
  if(p.pos==='pitcher'){
    if(s.w>=lead.w){p.awards.winKing++;got.push('다승왕');}
    if(s.k>=lead.so){p.awards.soKing++;got.push('탈삼진왕');}
    if(s.ip>=100&&s.era<=lead.era){p.awards.eraKing++;got.push('평균자책점 1위');}
  }else{
    if(s.hr>=lead.hr){p.awards.hrKing++;got.push('홈런왕');}
    if(s.ab>=300&&s.avg>=lead.avg){p.awards.hitKing++;got.push('타율 1위');}
    if(s.sb>=lead.sb){p.awards.sbKing++;got.push('도루왕');}
    if(s.war>=3.4&&ab(p,'defense')>=74&&R.c(.55)){p.awards.gg++;got.push('골든글러브');}
  }
  if(s.war>=3.1||(s.war>=2.4&&p.fame>=45)){p.awards.allstar++;got.push('올스타');}
  if(s.war>=lead.war&&s.war>=6){p.awards.mvp++;got.push('정규시즌 MVP');p.fame+=15;p.timeline.push({y:p.year,t:'정규시즌 MVP'});}
  if(p.year===2026&&s.war>=2.2){p.awards.rookie++;got.push('신인왕');p.timeline.push({y:p.year,t:'신인왕'});}
  got.forEach(g=>{if(!p.timeline.find(t=>t.y===p.year&&t.t===g)&&['홈런왕','다승왕','도루왕','탈삼진왕','타율 1위'].includes(g))p.timeline.push({y:p.year,t:g});});
  p.fame=clamp(p.fame+s.war*2.2+got.length*3-2,0,100);
  p.fanRating=clamp(p.fanRating+(s.war-2)*1.8+(p.flags.includes('troubleMaker')?-2:0)+tEff(p,'fan'),0,100);
  s.awardsGot=got;
  return got;
}

/* ── 포스트시즌 ── */
function rankCheck(p){
  const s=p.season;
  s.war=s.war||0;
  const rank=Math.round(clamp(11-(s.teamStr*1.6)-warNow(p)*.35+R.f(-1.6,1.6),1,10));
  s.rank=rank;
  p.inPost=rank<=5;
  return rank<=5
    ? [`팀은 정규시즌 <em>${rank}위</em>. 포스트시즌에 진출했다.`]
    : [`팀은 정규시즌 ${rank}위로 가을 야구에 실패했다.`];
}
function warNow(p){ // 시즌 확정 전 임시 WAR 추정
  const s=p.season;
  if(p.pos==='pitcher')return s.ip>0?(s.ip/9)*((4.90-(s.er*9/s.ip))*.17):0;
  const obp=s.pa>0?(s.h+s.bb)/s.pa:0, slg=s.ab>0?(s.h+s.d2+2*s.hr)/s.ab:0;
  return (s.g/144)*((obp+slg-.660)*15);
}
function postseason(p){
  const s=p.season,log=[];
  if(!p.inPost)return [];
  const big=1+tEff(p,'big');
  const perf=clamp((warNow(p)/6)*big*R.f(.4,1.7)+(p.cond-2)*.08+(p.clutchBonus||0)*.05,0,2.2);
  const games=R.i(4,13);
  p.post.games+=games;
  const pw=round(perf*1.2,1);p.post.war=round(p.post.war+pw,1);
  if(perf>=1.1){p.post.bigHits+=2;log.push('10월의 그는 다른 선수였다.');}
  else if(perf<=.45){p.post.fail++;log.push('가을에는 방망이가, 공이 무거웠다.');}
  const winP=clamp(.16+(s.teamStr-3)*.12+perf*.14,.05,.72);
  if(R.c(winP)){
    p.awards.champ++;p.timeline.push({y:p.year,t:'한국시리즈 우승'});
    log.push('<em>한국시리즈 우승.</em> 마운드 위에 모두가 쌓였다.');
    if(perf>=1.0&&R.c(.55)){p.awards.ksMvp++;p.timeline.push({y:p.year,t:'한국시리즈 MVP'});log.push('<em>한국시리즈 MVP</em>에 선정되었다.');p.fame+=12;}
    p.fanRating=clamp(p.fanRating+6,0,100);
  }else log.push('시즌은 우승 없이 끝났다.');
  return log;
}

/* ==========================================================================
   [11] ENGINE — 특성 획득 / 진화
   ========================================================================== */
function traitCheck(p){
  const out=[];
  // 진화
  for(const id of [...p.traits]){
    const t=TR(id);
    if(t&&t.evolve&&t.evolve.cond(p)&&!p.traits.includes(t.evolve.to)){
      p.traits[p.traits.indexOf(id)]=t.evolve.to;
      p.traitLog.push({y:p.year,id:t.evolve.to,from:id});
      out.push({type:'evolve',from:id,to:t.evolve.to});
    }
  }
  // 신규 획득
  const cands=TRAITS.filter(t=>!p.traits.includes(t.id)&&t.prob&&
      (t.pos==='all'||t.pos===p.pos)&&!p.traitLog.find(l=>l.id===t.id));
  for(const t of R.shuffle(cands)){
    let pr=0; try{pr=t.prob(p,p.season)||0;}catch(e){pr=0;}
    if(pr>0&&R.c(pr)){ out.push({type:'new',id:t.id}); break; }
  }
  return out;
}
function addTrait(p,id,replaceId){
  if(replaceId){
    p.traits[p.traits.indexOf(replaceId)]=id;
  }else p.traits.push(id);
  p.traitLog.push({y:p.year,id});
  p.season&&p.season.traits.push(id);
}

/* ==========================================================================
   [12] ENGINE — 오프시즌 / 은퇴 / 엔딩
   ========================================================================== */
function agingPhase(p){
  const log=[];
  if(p.age<30)return log;
  const rate=(p.age>=35?R.f(1.8,3.4):p.age>=33?R.f(1.0,2.2):R.f(.4,1.2))*(1+tEff(p,'aging'));
  const phys=p.pos==='pitcher'?['velo','stamina','recovery']:['speed','run','stamina','defense'];
  const dropped=[];
  phys.forEach(k=>{ if(p.st[k]===undefined)return;
    const d=round(rate*R.f(.5,1.2),1);
    if(d>.1){p.st[k]=clamp(round(p.st[k]-d,1),1,100);dropped.push(`${SLABEL[k]} -${d}`);}
  });
  const skill=p.pos==='pitcher'?['control','breaking']:['contact','eye','mental'];
  if(p.age<36)skill.forEach(k=>{if(p.st[k]!==undefined&&R.c(.5))p.st[k]=clamp(round(p.st[k]+R.f(.2,.9),1),1,100);});
  if(dropped.length)log.push(`몸이 달라졌다 — ${dropped.join('  ')}`);
  return log;
}
function natCall(p){
  const s=p.season;
  if(s.war<3.6||p.age>34)return null;
  if(!R.c(.55))return null;
  p.nat.caps++;flag(p,'nationalTeam');
  const gold=R.c(.3+ (s.war-3.6)*.05);
  if(gold){p.nat.gold++;p.timeline.push({y:p.year,t:'국제대회 우승'});}
  const big=gold&&R.c(.5);
  if(big)p.nat.bigMoment++;
  p.fame=clamp(p.fame+8,0,100);p.fanRating=clamp(p.fanRating+(gold?7:3),0,100);
  return gold
    ?`국가대표로 <em>국제대회 우승</em>. ${big?'결승전 결승타의 주인공이 그였다.':'대표팀의 중심에 그가 있었다.'}`
    :'국가대표로 발탁되어 국제대회에 출전했다.';
}
function faEligible(p){return p.seasonsPlayed>=8&&!p.faDone;}
function contractValue(p){
  const base=ovr(p)*1.1+p.tot.war*.8+p.fame*.4-(p.age-27)*3-p.injuries.length*2;
  return Math.max(3,Math.round(base/4));
}
function retireCheck(p){
  if(p.age>=44)return true;
  if(p.age>=33&&ovr(p)<48)return true;
  if(p.age>=31&&p.season.war<0.2&&p.injuries.length>=3)return true;
  return false;
}
function decideEnding(p){
  for(const e of ENDINGS)if(e.when(p))return e;
  return ENDINGS[ENDINGS.length-1];
}
function careerGrade(p){
  const sc=p.tot.war*1.0+p.awards.mvp*8+p.awards.champ*5+p.awards.ksMvp*5+p.awards.allstar*1.5
    +p.nat.gold*4+p.fanRating*.08;
  if(sc>=110)return 'S+';if(sc>=85)return 'S';if(sc>=65)return 'A';
  if(sc>=45)return 'B';if(sc>=28)return 'C';if(sc>=14)return 'D';return 'F';
}
function seasonGrade(w){return w>=7?'S':w>=5?'A':w>=3.2?'B':w>=1.5?'C':w>=0?'D':'F';}

/* ==========================================================================
   [15] FLOW — 페이즈 진행
   ========================================================================== */
function startGame(name,pos){
  G.p=createPlayer(name,pos);G.pi=-1;G.screen='game';advance();
}
function advance(){
  if(G.ui&&G.ui.after){G.ui.after=0;G.pi--;}
  G.pi++;
  if(G.pi>=PHASES.length)G.pi=0;
  const r=runPhase(PHASES[G.pi]);
  if(r==='skip')return advance();
}
function runPhase(ph){
  const p=G.p;
  switch(ph){
  case 'seasonStart':{
    newSeason(p);
    const t=TEAM(p.team);
    return scene({when:`${p.year}년 1월 · 동계훈련`,title:`${p.year} 시즌`,
      body:`${t.name}, ${p.age}세.\n올 시즌 당신의 위치는 <em>${p.lv}</em>이다.\n\n${t.tag}`,
      cta:'훈련 시작'});
  }
  case 'train':return trainMenu();
  case 'event':return storyEvent();
  case 'moment1':case 'moment2':return momentEvent();
  case 'half1':return halfResult('전반기');
  case 'half2':return halfResult('후반기');
  case 'rank':{
    const log=rankCheck(p);
    return scene({when:`${p.year}년 9월 · 정규시즌 종료`,title:'순위가 결정됐다',
      body:'',log,cta:p.inPost?'가을 야구로':'시즌 결산'});
  }
  case 'ksMoment':{
    if(!p.inPost)return 'skip';
    const m=MOMENTS.find(x=>x.id==='M_KS');
    return showMoment(m);
  }
  case 'post':{
    if(!p.inPost)return 'skip';
    const log=postseason(p);
    return scene({when:`${p.year}년 10월 · 포스트시즌`,title:'가을',body:'',log,cta:'시즌 결산'});
  }
  case 'award':{
    finalizeSeason(p);
    const got=awardsPhase(p);
    const agl=agingPhase(p);
    p.career.seasons.push(JSON.parse(JSON.stringify(p.season)));
    return scene({when:`${p.year}년 11월`,title:`${p.year} 시즌 결산`,
      html:seasonSummaryHtml(p,got,agl),cta:'계속'});
  }
  case 'traits':{
    if(!p.season.traitChecked){p.season.traitChecked=true;G.tq=G.tq.concat(traitCheck(p));}
    if(!G.tq.length)return 'skip';
    const ev=G.tq.shift();
    if(ev.type==='evolve')
      return scene({when:'특성 진화',title:'무언가 달라졌다',
        body:`[${ev.from}] 이(가) 한 단계 나아갔다.\n\n<em>[${ev.to}]</em>\n${TR(ev.to).desc}`,
        cta:'계속',after:1});
    const t=TR(ev.id);
    if(p.traits.length<6){
      addTrait(p,ev.id);
      return scene({when:'새로운 특성',title:'새로운 특성을 발견했다',
        body:`<em>[${t.id}]</em>  (${t.grade})\n${t.desc}`,cta:'계속',after:1});
    }
    return scene({when:'새로운 특성',title:'특성 슬롯이 가득 찼다',
      body:`<em>[${t.id}]</em>  (${t.grade})\n${t.desc}\n\n어떤 특성을 대신 내보낼까?`,
      choices:[...p.traits.map(id=>({t:`[${id}] 을(를) 내보낸다`,s:TR(id).desc,
          run:()=>{addTrait(p,ev.id,id);return [`[${id}] 이(가) 커리어 기록으로 남았다.`];}})),
        {t:'새 특성을 받지 않는다',s:'현재 특성을 모두 유지',run:()=>['그는 하던 대로 하기로 했다.']}],
      after:1});
  }
  case 'nat':{
    const r=natCall(p);
    if(!r)return 'skip';
    return scene({when:'국가대표',title:'태극마크',body:'',log:[r],cta:'계속'});
  }
  case 'fa':return faPhase();
  case 'retire':return retirePhase();
  case 'yearEnd':{
    p.age++;p.year++;p.fatigue=clamp(p.fatigue-30,0,100);updateCond(p);
    G.pi=-1;return advance();
  }}
}
/* ── 훈련 ── */
function trainMenu(){
  const p=G.p;
  const when=G.pi<=1?`${p.year}년 2월 · 스프링캠프`:`${p.year}년 7월 · 올스타 휴식기`;
  return scene({when,title:'무엇에 시간을 쓸까',
    body:`시간은 한정되어 있다.\n무엇을 얻으면 무엇을 잃는다.`,
    choices:TRAININGS[p.pos].map(t=>({t:t.name,s:t.sub,run:()=>doTraining(p,t)}))});
}
/* ── 스토리 이벤트 ── */
function storyEvent(){
  const p=G.p;
  const pool=EVENTS.filter(e=>{
    if(e.once&&p.seenEvents.includes(e.id))return false;
    try{return e.when(p);}catch(err){return false;}
  });
  if(!pool.length)return 'skip';
  const bag=[];pool.forEach(e=>{for(let i=0;i<(e.w||5);i++)bag.push(e);});
  const e=R.pick(bag);
  p.seenEvents.push(e.id);
  return scene({when:`${p.year}년`,title:e.title,body:e.text(p),
    choices:e.choices.map(c=>({t:c.t,s:c.s,run:()=>c.run(p)}))});
}
/* ── 결정적 순간 ── */
function momentEvent(){
  const p=G.p;
  const pool=MOMENTS.filter(m=>m.id!=='M_KS'&&(m.pos==='all'||m.pos===p.pos)&&
    (!m.once||!p.seenEvents.includes(m.id))&&(()=>{try{return m.when(p)}catch(e){return false}})());
  if(!pool.length||R.c(.25))return 'skip';
  return showMoment(R.pick(pool));
}
function showMoment(m){
  const p=G.p;p.seenEvents.push(m.id);
  return scene({when:m.ks?`${p.year}년 10월`:`${p.year}년 · 경기 중`,title:m.title,body:m.text(p),
    choices:m.choices.map(c=>({t:c.t,run:()=>c.kind?momentResult(p,c.kind,!!m.ks):c.run(p).map(x=>{
      p.clutchBonus+=x.mod||0;return x.msg;})}))});
}
function momentResult(p,kind,isKS){
  const base=p.pos==='pitcher'
    ? (ab(p,'stuff')+ab(p,'control')+ab(p,'crisis')+ab(p,'mental'))/4
    : (ab(p,'contact')+ab(p,'power')*.7+ab(p,'mental')+ab(p,'lead')*0)/2.7;
  let pr=clamp((base-42)/68,.08,.86)+ (tEff(p,'clutch')+p.clutchBonus)*.006+condMod(p);
  let gain=3;
  if(kind==='aggr'){pr-=.10;gain=6;tend(p,{aggression:5,competitive:4});}
  if(kind==='safe'){pr+=.12;gain=1.5;tend(p,{patience:4,selfish:-2});}
  if(kind==='patient'){tend(p,{patience:3});}
  const ok=R.c(clamp(pr,.05,.93));
  const log=[];
  const bat=p.pos!=='pitcher';
  if(ok){
    p.clutchBonus+=gain;p.season.bigHits++;p.fame=clamp(p.fame+(isKS?7:2),0,100);
    p.fanRating=clamp(p.fanRating+(isKS?4:1.5),0,100);
    tend(p,{star:3,competitive:2});
    log.push(bat?(kind==='aggr'?'초구를 그대로 잡아당겼다. 타구는 담장을 넘어갔다.'
                 :kind==='safe'?'깊은 외야 뜬공. 3루 주자가 홈을 밟았다.'
                 :'풀카운트 끝에 중전 적시타.')
              :(kind==='aggr'?'삼진. 그는 마운드를 끝까지 지켰다.'
                 :kind==='safe'?'바뀐 투수가 병살로 이닝을 끝냈다. 판단이 옳았다.'
                 :'한 타자를 잡고 내려왔다. 관중석이 일어섰다.'));
    if(isKS){p.post.bigHits+=2;p.timeline.push({y:p.year,t:'가을의 결정적 장면'});}
    if(kind==='aggr'&&bat&&R.c(.25)&&!p.traits.includes('끝내기 본능'))G.tq.push({type:'new',id:'끝내기 본능'});
    if(kind==='aggr'&&!bat&&R.c(.2)&&!p.traits.includes('위기관리의 달인'))G.tq.push({type:'new',id:'위기관리의 달인'});
  }else{
    p.clutchBonus-=1.5;grow(p,{mental:.6});
    if(isKS)p.post.fail++;
    log.push(bat?(kind==='aggr'?'초구 헛스윙 삼진. 배트가 허공을 갈랐다.'
                 :'끝까지 지켜본 공은 스트라이크였다. 루킹 삼진.')
              :'역전을 허용했다. 더그아웃은 조용했다.');
    log.push('오래 기억에 남을 장면이 되었다.');
  }
  return log;
}
/* ── 반기 결과 ── */
function halfResult(name){
  const p=G.p;
  const log=simHalf(p,name,p.clutchBonus*.2);
  return scene({when:`${p.year}년 · ${name}`,title:`${name} 결과`,body:'',log,cta:'계속'});
}
/* ── 시즌 요약 ── */
function seasonSummaryHtml(p,got,agl){
  const s=p.season,pit=p.pos==='pitcher';
  const rows=pit
    ? [['경기',s.g],['이닝',s.ip],['승-패',`${s.w}-${s.l}`],['평균자책',s.era],['탈삼진',s.k],['WAR',s.war]]
    : [['경기',s.g],['타율',s.ab>0?avg3(s.h/s.ab):'-'],['홈런',s.hr],['타점',s.rbi],['도루',s.sb],['WAR',s.war]];
  return `<div class="bigline">${rows.map(([l,v])=>`<div><div class="n">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="center" style="margin:10px 0 4px"><span class="grade">${seasonGrade(s.war)}</span>
      <span class="sm dim"> 시즌 평가</span></div>
    ${got.length?`<div class="center" style="margin:12px 0">${got.map(g=>`<span class="pill" style="color:var(--lamp);border-color:var(--lamp)">${g}</span>`).join('')}</div>`:''}
    ${agl.length?`<div class="log" style="border-color:var(--red)">${agl.map(a=>`<div>${a}</div>`).join('')}</div>`:''}
    <div class="center sm dim" style="margin-top:14px">팬 평가 ${'★'.repeat(clamp(Math.round(p.fanRating/20),0,5))}${'☆'.repeat(5-clamp(Math.round(p.fanRating/20),0,5))}</div>`;
}
/* ── FA ── */
function faPhase(){
  const p=G.p;
  if(!faEligible(p))return 'skip';
  p.faDone=true;
  const v=contractValue(p);
  const others=R.shuffle(TEAMS.filter(t=>t.id!==p.team)).slice(0,2);
  const rich=others.sort((a,b)=>b.money-a.money)[0];
  return scene({when:`${p.year}년 12월 · FA`,title:'자유계약선수',
    body:`${p.seasonsPlayed}시즌을 채웠다. 이제 팀을 고를 수 있다.\n\n현 소속 ${TEAM(p.team).name} — ${v}억 규모 제시\n${rich.name} — ${Math.round(v*R.f(1.15,1.5))}억 규모 제시`,
    choices:[
      {t:`${TEAM(p.team).name}에 남는다`,s:'팀 충성도 ↑↑ 팬 평가 ↑',run:()=>{
        tend(p,{loyalty:18});p.fanRating=clamp(p.fanRating+6,0,100);flag(p,'franchiseStar');
        p.timeline.push({y:p.year,t:'FA 잔류'});return['그는 남기로 했다. 팬들은 그 선택을 오래 기억했다.'];}},
      {t:`${rich.name}으로 이적한다`,s:'조건 ↑↑ 팀 충성도 ↓',run:()=>{
        p.team=rich.id;if(!p.teamsPlayed.includes(rich.id))p.teamsPlayed.push(rich.id);
        tend(p,{loyalty:-14,star:6});p.fanRating=clamp(p.fanRating-4,0,100);
        p.timeline.push({y:p.year,t:`${rich.name} 이적`});return[`${rich.name}의 유니폼을 입는다.`];}},
      {t:'더 좋은 조건을 기다린다',s:'위험 · 보상 모두 큼',run:()=>{
        if(R.c(.45)){const t2=R.pick(TEAMS.filter(t=>t.id!==p.team));p.team=t2.id;
          if(!p.teamsPlayed.includes(t2.id))p.teamsPlayed.push(t2.id);
          p.timeline.push({y:p.year,t:`${t2.name} 이적`});
          return[`늦게까지 기다린 끝에 ${t2.name}과 큰 계약을 맺었다.`];}
        p.fatigue+=10;tend(p,{loyalty:-6});
        return['시장은 차가웠다. 결국 원 소속팀과 낮은 조건에 재계약했다.'];}}
    ]});
}
/* ── 은퇴 ── */
function retirePhase(){
  const p=G.p;
  const forced=retireCheck(p);
  const ask=p.age>=33||p.season.war<0.6&&p.age>=30;
  if(!forced&&!ask)return 'skip';
  if(forced&&p.age>=44)return doRetire('몸이 먼저 대답했다.');
  return scene({when:`${p.year}년 12월`,title:forced?'마지막을 생각할 때':'한 시즌 더?',
    body:forced?`구단에서 연락이 왔다. 내년 계획에 당신의 자리는 없다.\n${p.age}세. 사람들은 이제 그의 이름을 과거형으로 부른다.`
              :`${p.age}세. 아직 할 수 있다는 생각과, 이쯤이면 됐다는 생각이 같이 든다.`,
    choices:forced?[
      {t:'은퇴한다',run:()=>doRetire('그는 스스로 끝을 정했다.')},
      {t:'다른 팀에서 기회를 찾는다',s:'능력치 하락 감수',run:()=>{
        if(R.c(.5)){const t2=R.pick(TEAMS.filter(t=>t.id!==p.team));p.team=t2.id;
          if(!p.teamsPlayed.includes(t2.id))p.teamsPlayed.push(t2.id);
          p.timeline.push({y:p.year,t:`${t2.name} 이적`});return[`${t2.name}이 손을 내밀었다.`];}
        return doRetire('어느 팀도 전화를 걸지 않았다.'),['불러주는 팀은 없었다.'];}}
    ]:[
      {t:'한 시즌 더 뛴다',s:'몸은 정직하다',run:()=>{tend(p,{competitive:6});return['그는 다시 캠프로 향했다.'];}},
      {t:'여기서 은퇴한다',s:'가장 좋은 모습으로',run:()=>doRetire('가장 좋았던 시절의 모습으로 떠나기로 했다.')}
    ]});
}
function doRetire(line){
  const p=G.p;p.retired=true;p.retireLine=line;
  p.timeline.push({y:p.year,t:'은퇴'});
  p.ending=decideEnding(p);
  saveHof(p);
  G.screen='ending';render();Store.del('save_v1');G.hasSave=false;
  return [];
}
/* ── 엔딩 화면 ── */
function viewEnding(){
  const p=G.p,e=p.ending,pit=p.pos==='pitcher';
  const rows=pit
    ?[[p.tot.w,'승'],[p.tot.k,'탈삼진'],[p.tot.ip>0?round(p.tot.er*9/p.tot.ip,2):'-','평균자책'],[p.tot.war,'WAR']]
    :[[p.tot.h,'안타'],[p.tot.hr,'홈런'],[p.tot.ab>0?avg3(p.tot.h/p.tot.ab):'-','타율'],[p.tot.war,'WAR']];
  const aw=[[p.awards.mvp,'MVP'],[p.awards.allstar,'올스타'],[p.awards.champ,'우승'],
    [p.awards.ksMvp,'한국시리즈 MVP'],[p.awards.gg,'골든글러브'],[p.nat.gold,'국제대회 우승']]
    .filter(a=>a[0]>0).map(a=>`${a[1]} ${a[0]}회`);
  const rv=p.rival;
  const rvLine=rv.bond>=70?`"그는 평생의 경쟁자이자 가장 가까운 친구였다."`
    :rv.bond<=30?`"두 선수는 ${p.seasonsPlayed}년 동안 서로를 인정하지 않았다."`
    :`"${rv.name}이 없었다면, 그는 이만큼 오지 못했을 것이다."`;
  return `<div class="ending">
    <div class="yr">${p.career.seasons[0]?p.career.seasons[0].year:2026} — ${p.year}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="sm dim">${POS[p.pos].label} · ${p.teamsPlayed.map(t=>TEAM(t).short).join(' → ')}</div>
    <div class="bigline">${rows.map(([n,l])=>`<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
    ${aw.length?`<div>${aw.map(a=>`<span class="pill">${a}</span>`).join('')}</div>`:''}
    <div class="rule"></div>
    <div>${p.traits.map(t=>`<span class="pill" style="color:var(--lamp);border-color:rgba(245,196,81,.5)">${t}</span>`).join('')}</div>
    <div class="rule"></div>
    <div class="sm dim">최종 평가 · ${careerGrade(p)}</div>
    <div class="verdict">${esc(e.title)}</div>
    <div class="quote">${esc(e.quote).replace(/\n/g,'<br>')}</div>
    <div class="sm dim" style="margin-top:14px">${esc(p.retireLine||'')}</div>
    <div class="quote" style="font-size:14px;margin-top:10px">${esc(rvLine)}</div>
    <div class="rule"></div>
    <div class="tl">${p.timeline.map(t=>`<div><b>${t.y}</b><span>${esc(t.t)}</span></div>`).join('')}</div>
    <div class="rule"></div>
    <div class="menu">
      <button onclick="go('hof')">명예의 전당</button>
      <button onclick="go('title')">새로운 선수</button>
    </div>
  </div>`;
}
/* ── 명예의 전당 ── */
function viewHof(){
  const list=[...G.hof].sort((a,b)=>b.war-a.war);
  return `<div class="title" style="max-width:700px">
    <div class="kicker">기록실</div><h1 style="font-size:36px">명예의 전당</h1>
    <div class="panel" style="text-align:left;margin-top:24px">
    ${list.length?list.map((h,i)=>`<div class="hofrow">
      <span class="rk">${i+1}</span><span class="nm">${esc(h.name)}</span>
      <span class="sm dim">${h.pos} · ${h.years}</span>
      <span class="sm" style="margin-left:auto;text-align:right">
        <b class="num" style="font-size:17px">${h.war}</b> WAR<br>
        <span class="dim">${esc(h.ending)}</span></span></div>`).join('')
      :'<span class="dim sm">아직 은퇴한 선수가 없습니다.</span>'}
    </div>
    <div class="menu" style="margin-top:20px"><button onclick="go('title')">돌아가기</button></div>
  </div>`;
}

/* ==========================================================================
   [16] 이벤트 핸들러 / 저장
   ========================================================================== */
function choose(i){
  const c=G.ui.choices[i];
  const log=c.run()||[];
  if(G.p.retired)return;
  scene({when:G.ui.when,title:G.ui.title,body:'',log:log.length?log:['…'],cta:'계속',after:G.ui.after});
}
function setTab(t){G.tab=t;render();}
function go(s){
  if(s==='create')G.create={name:mkName(),pos:null};
  G.screen=s;render();
}
function reroll(){G.create.name=mkName();render();}
function pickPos(pos){
  const v=(document.getElementById('nm').value||'').trim()||mkName();
  startGame(v.slice(0,6),pos);
}
async function save(){
  if(!G.p||G.p.retired)return;
  const u=G.ui||{};
  const resume=(u.choices||u.after)?G.pi:G.pi+1; // 선택 대기 중이면 같은 지점, 결과 화면이면 다음 지점
  await Store.set('save_v1',{p:G.p,resume,tq:G.tq});
  G.hasSave=true;
}
async function loadGame(){
  const d=await Store.get('save_v1');
  if(!d)return;
  G.p=d.p;G.tq=d.tq||[];G.pi=d.resume-1;G.ui=null;G.screen='game';advance();
}
async function saveHof(p){
  G.hof.push({name:p.name,pos:POS[p.pos].label,war:p.tot.war,
    years:`${p.career.seasons[0]?p.career.seasons[0].year:2026}~${p.year}`,
    ending:p.ending.title,mvp:p.awards.mvp,champ:p.awards.champ});
  await Store.set('hof_v1',G.hof);
}
(async function boot(){
  G.hof=(await Store.get('hof_v1'))||[];
  G.hasSave=!!(await Store.get('save_v1'));
  render();
})();

</script>
</body>
</html>
